<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Подводный спорт | Контакты</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <nav>
            <a href="index.html" class="nav-btn">Главная</a>
            <a href="catalog.html" class="nav-btn">Виды спорта</a>
            <a href="gallery.html" class="nav-btn">Галерея</a>
            <a href="contacts.html" class="nav-btn active">Контакты</a>
        </nav>
    </header>

    <main class="container">
        <h2>Свяжитесь с нами</h2>
        <p>Хотите записаться в секцию подводного спорта или задать вопрос экспертам? Заполните форму ниже, и мы свяжемся с вами!</p>

        <form action="#" method="post" onsubmit="alert('Спасибо! Ваша заявка успешно отправлена (демонстрация).'); return false;">
            <div class="form-group">
                <label for="name">Ваше имя:</label>
                <input type="text" id="name" name="name" placeholder="Иван Иванов" required>
            </div>

            <div class="form-group">
                <label for="email">Электронная почта (Email):</label>
                <input type="email" id="email" name="email" placeholder="example@mail.ru" required>
            </div>

            <div class="form-group">
                <label for="message">Ваш вопрос или заявка:</label>
                <textarea id="message" name="message" rows="5" placeholder="Какой вид спорта мне подойдет..." required></textarea>
            </div>

            <button type="submit" class="submit-btn">Отправить заявку</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 Информационный портал о подводном спорте</p>
    </footer>

</body>
</html>
